modLoader = "javafml"
loaderVersion = "${loader_version}"
license = "${license}"
[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
displayURL="https://www.curseforge.com/minecraft/mc-mods/construction-wands-revived"
logoFile="logo.png"
authors="${mod_author}"
description="${description}"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${loader_version}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
