plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.147'
}

// The code and the resources shared by both loaders live in the common folder
def common = project(':common')

version = "${mcversion}-${mod_version}-${tag_lanzador}"
group = "${mod_group}"
base {
    archivesName = "${mod_named}"
}

// Minecraft 1.21.3 needs Java 21
java.toolchain {
    vendor = JvmVendorSpec.ADOPTIUM
    languageVersion = JavaLanguageVersion.of(java_version.toInteger())
}

// Genera tambien <nombre>-sources.jar junto al jar del mod
java {
    withSourcesJar()
}

neoForge {
    version = "${neoversion}"

    runs {
        client {
            client()
            gameDirectory = rootProject.file('run')
        }

        server {
            server()
            gameDirectory = rootProject.file('run')
            programArgument '--nogui'
        }

        data {
            data()
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', "${modid}", '--all', '--output', common.file('src/generated/resources').getAbsolutePath(), '--existing', common.file('src/main/resources').getAbsolutePath()
        }
    }

    mods {
        "${modid}" {
            sourceSet(sourceSets.main)
        }
    }
}

// The code and the resources shared by both loaders, and the generated data
sourceSets.main {
    java.srcDir(common.file('src/main/java'))
    resources {
        srcDir(common.file('src/main/resources'))
        srcDir(common.file('src/generated/resources'))
    }
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.creeperhost.net'
        content {
            includeGroup("com.refinedmods.refinedstorage")
        }
    }
    maven {
        url = "https://maven.blamejared.com"
    }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven { url "https://maven.shedaniel.me" }
    maven {
        name = "Curse Maven"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url = uri("https://modmaven.dev/")
        content {
            includeGroup "appeng"
            includeGroup "de.mari_023"
        }
    }
}

dependencies {
    //jei
    compileOnly "mezz.jei:jei-${jei_mcversion}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${jei_mcversion}-neoforge-api:${jei_version}"

    //rei (Roughly Enough Items)
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-neoforge:${rei_version}"

    switch (runtime_itemlist_mod) {
        case "rei":
            runtimeOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"
            break
        case "jei":
            runtimeOnly "mezz.jei:jei-${jei_mcversion}-neoforge:${jei_version}"
            break
    }

    //sophisticated backpacks
    compileOnly "curse.maven:sophisticated-backpacks-422301:${sophisticatedbackpacks_version}"

    //sophisticated core
    compileOnly "curse.maven:sophisticated-core-618298:${sophisticatedcore_version}"
}

test {
    enabled = false
}

jar {
    manifest {
        attributes([
                "Specification-Title": mod_named,
                "Specification-Vendor": "${author}",
                "Specification-Version": "1", // We are version 1 of ourselves
                "Implementation-Title": mod_named,
                "Implementation-Version": "${version}",
                "Implementation-Vendor" :"${author}",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Includes the license file in the built mod
tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) { rename { "${it}-${modid}" } }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            mod_id                        : modid,
            mod_name                      : mod_name,
            mod_author                    : author,
            version                       : mod_version,
            license                       : license,
            description                   : project.description,
            credits                       : '',
            minecraft_version_range       : minecraft_version_range,
            neoforge_version              : neoversion,
            neoforge_loader_version_range : loader_version,
            jei_version                    : jei_version,
            guideme_version                : '0',
            ae2_version                    : '0',
            refinedstorage_version         : '0',
            sophisticatedcore_version      : sophisticatedcore_version,
            sophisticatedbackpacks_version : sophisticatedbackpacks_version,
            curios_version                 : '0',
            ae2wtlib_version               : '0',
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
    filesMatching(['pack.mcmeta']) {
        expand pack_format: pack_format
    }

    exclude 'fabric.mod.json', '*.mixins.json'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
