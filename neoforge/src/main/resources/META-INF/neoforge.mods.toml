modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"
[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
displayURL="https://www.curseforge.com/minecraft/mc-mods/construction-wands-revived"
bannerFile="logo.png"
authors="${mod_author}"
description="${description}"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neoforge_version},)"
    ordering = "NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering = "NONE"
    side="BOTH"

# jei dependency 
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="${jei_version}"
    ordering="AFTER"
    side = "BOTH"

# emi dependency
[[dependencies.${mod_id}]]
    modId="emi"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="CLIENT"

# guideme dependency 
[[dependencies.${mod_id}]]
    modId="guideme"
    type="optional"
    versionRange="${guideme_version}"
    ordering="AFTER"
    side = "BOTH"

# ae2 dependency 
[[dependencies.${mod_id}]]
    modId="ae2"
    type="optional"
    versionRange="${ae2_version}"
    ordering="AFTER"
    side = "BOTH"

# refined storage dependency 
[[dependencies.${mod_id}]]
    modId="refinedstorage"
    type="optional"
    versionRange="${refinedstorage_version}"
    ordering="AFTER"
    side = "BOTH"

# sophisticated core dependency 
[[dependencies.${mod_id}]]
    modId="sophisticatedcore"
    type="optional"
    versionRange="${sophisticatedcore_version}"
    ordering="AFTER"
    side = "BOTH"

# sophisticated backpacks dependency 
[[dependencies.${mod_id}]]
    modId="sophisticatedbackpacks"
    type="optional"
    versionRange="${sophisticatedbackpacks_version}"
    ordering="AFTER"
    side = "BOTH"

[[dependencies.${mod_id}]]
modId = "curios"
type="optional"
versionRange = "${curios_version}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ae2wtlib"
type="optional"
versionRange = "${ae2wtlib_version}"
ordering = "NONE"
side = "BOTH"
# rei dependency
[[dependencies.${mod_id}]]
    modId="roughlyenoughitems"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="CLIENT"

# botania dependency
[[dependencies.${mod_id}]]
    modId="botania"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
