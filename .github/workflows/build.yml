name: Build and Release

on:
  push:
    branches:
      - "Multi/1.21.6"
    paths:
      - "common/**"
      - "neoforge/**"
      - "fabric/**"
      - "*.gradle.kts"
      - "gradle.properties"
jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Gradle itself runs on JDK 25, the per-version Java toolchains (21 / 25) are provisioned from this too
      - name: Set up JDKs
        uses: actions/setup-java@v6
        with:
          java-version: |
            21
            25
          distribution: "temurin"

      - name: Read Version
        id: mod_props
        run: |
          VERSION=$(grep -m1 '^mod.version' gradle.properties | cut -d= -f2 | tr -d " ")
          echo "mod_version=$VERSION" >> $GITHUB_OUTPUT
          echo "release_version=${VERSION}+1.21.6-build.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Builds NeoForge and Fabric for Minecraft 1.21.6
      - name: Build
        run: ./gradlew build

      - name: Collect jars
        run: |
          mkdir -p dist
          find neoforge fabric -path '*/build/libs/*.jar' ! -name '*-sources.jar' -exec cp {} dist/ \;
          ls dist

      - name: Create Tag
        run: |
          git tag v${{ steps.mod_props.outputs.release_version }}
          git push origin v${{ steps.mod_props.outputs.release_version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.mod_props.outputs.release_version }}
          name: ConstructionWandsRevived ${{ steps.mod_props.outputs.release_version }}
          generate_release_notes: true
          files: |
            dist/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
