name: Build and Release

on:
  push:
    branches:
      - "multiloader/1.20.1"
    paths:
      - "common/**"
      - "forge/**"
      - "fabric/**"
      - "*.gradle"
      - "gradle.properties"
      - "CHANGELOG.md"
      - ".github/workflows/build.yml"
jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Gradle itself runs on JDK 25, the Java 17 toolchain of Minecraft 1.20.1 is provisioned from this too
      - name: Set up JDKs
        uses: actions/setup-java@v6
        with:
          java-version: |
            17
            25
          distribution: "temurin"

      - name: Read Version
        id: mod_props
        run: |
          VERSION=$(grep -m1 '^mod_version=' gradle.properties | cut -d= -f2 | tr -d " ")
          echo "mod_version=$VERSION" >> $GITHUB_OUTPUT
          echo "release_version=${VERSION}+1.20.1-build.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Builds Forge and Fabric for Minecraft 1.20.1
      - name: Build
        run: ./gradlew build

      - name: Collect jars
        run: |
          mkdir -p dist
          find forge fabric -path '*/build/libs/*.jar' ! -name '*-sources.jar' -exec cp {} dist/ \;
          ls dist

      - name: Create Tag
        run: |
          git tag v${{ steps.mod_props.outputs.release_version }}
          git push origin v${{ steps.mod_props.outputs.release_version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.mod_props.outputs.release_version }}
          name: ConstructionWandsRevived ${{ steps.mod_props.outputs.release_version }}
          generate_release_notes: true
          files: |
            dist/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publishes the jars to CurseForge only when the pushed commit message contains [curseforge], optionally with a
      # release type: [curseforge], [curseforge beta] or [curseforge alpha]. Needs the CURSEFORGE_TOKEN secret and the
      # CURSEFORGE_PROJECT_ID variable of the repository.
      - name: Publish to CurseForge
        if: ${{ contains(github.event.head_commit.message, '[curseforge') }}
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          MOD_VERSION: ${{ steps.mod_props.outputs.mod_version }}
        run: |
          set -euo pipefail
          : "${CURSEFORGE_TOKEN:?Add the CURSEFORGE_TOKEN secret to the repository}"
          : "${CURSEFORGE_PROJECT_ID:?Add the CURSEFORGE_PROJECT_ID variable to the repository}"
          MC="1.20.1"

          RELEASE_TYPE=release
          if [[ "$COMMIT_MESSAGE" =~ \[curseforge\ (alpha|beta|release)\] ]]; then RELEASE_TYPE="${BASH_REMATCH[1]}"; fi

          # The changelog section of this mod version, or a plain line when it has none
          CHANGELOG=""
          [ ! -f CHANGELOG.md ] || CHANGELOG=$(awk -v v="$MOD_VERSION" '/^## /{ if (found) exit; if (index($0, "## " v " ") == 1 && $0 !~ /\(Español\)/) found=1 } found' CHANGELOG.md)
          [ -n "$CHANGELOG" ] || CHANGELOG="Construction Wands Revived $MOD_VERSION for Minecraft $MC."

          for loader in forge fabric; do
            # A jar that is already on CurseForge (marked with a tag once it was uploaded) is not uploaded again
            tag="curseforge-$loader-$MC-$MOD_VERSION"
            if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
              echo "$loader $MC $MOD_VERSION is already on CurseForge (tag $tag), not uploading it again"
              continue
            fi

            jar=$(ls "$loader"/build/libs/*.jar | grep -v -- '-sources' | head -n1)
            if [ "$loader" = forge ]; then loader_name=Forge; relations='[]'
            else loader_name=Fabric; relations='[{"slug":"fabric-api","type":"requiredDependency"}]'; fi

            metadata=$(jq -nc \
              --arg changelog "$CHANGELOG" \
              --arg type "$RELEASE_TYPE" \
              --arg name "ConstructionWandsRevived-$MC-$MOD_VERSION-$loader_name" \
              --arg mc "$MC" --arg loader "$loader_name" \
              --argjson relations "$relations" \
              '{changelog: $changelog, changelogType: "markdown", releaseType: $type, displayName: $name,
                gameVersionNames: [$mc, $loader, "Client", "Server"]}
              + (if ($relations | length) > 0 then {relations: {projects: $relations}} else {} end)')

            echo "Uploading $jar to CurseForge as a $RELEASE_TYPE for $loader_name $MC"
            curl -sS --fail-with-body -X POST \
              "https://minecraft.curseforge.com/api/projects/$CURSEFORGE_PROJECT_ID/upload-file" \
              -H "X-Api-Token: $CURSEFORGE_TOKEN" \
              -F "metadata=$metadata" -F "file=@$jar"
            echo
            git tag "$tag"
            git push origin "$tag"
          done
